server {
    listen 80;
    server_name riad-design.cloud www.riad-design.cloud;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name devops.riad-design.cloud;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name portfolio.riad-design.cloud;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name riad-design.cloud www.riad-design.cloud;

    ssl_certificate     /etc/letsencrypt/live/riad-design.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riad-design.cloud/privkey.pem;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass riad-php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.env {
        deny all;
    }
}

server {
    listen 443 ssl http2;
    server_name devops.riad-design.cloud;

    ssl_certificate     /etc/letsencrypt/live/devops.riad-design.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devops.riad-design.cloud/privkey.pem;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass riad-php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.env {
        deny all;
    }
}

server {
    listen 443 ssl http2;
    server_name portfolio.riad-design.cloud;

    ssl_certificate     /etc/letsencrypt/live/portfolio.riad-design.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.riad-design.cloud/privkey.pem;

    location / {
        proxy_pass http://riad-portfolio:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
