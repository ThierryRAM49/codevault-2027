<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel - CodeVaultAI</title>
    <link rel="icon" href="./assets/icon.png">
    <link href="./css/tailwind.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-white min-h-screen p-8 text-center font-sans selection:bg-cyan-500 selection:text-white">

    <h1 class="text-4xl font-bold mb-8 text-cyan-400">🛡️ Token Generator</h1>

    <div class="max-w-2xl mx-auto bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-2xl">

        <!-- Generator Section -->
        <div class="mb-12">
            <h2 class="text-2xl font-bold mb-4">Generate New Token</h2>
            <div class="flex justify-center gap-4">
                <button id="btn-create-admin"
                    class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-lg transition shadow-[0_0_15px_rgba(220,38,38,0.4)]">
                    Create ADMIN Token
                </button>
                <button id="btn-create-user"
                    class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-6 rounded-lg transition shadow-[0_0_15px_rgba(22,163,74,0.4)]">
                    Create USER Token
                </button>
            </div>

            <div id="new-token-display"
                class="hidden mt-6 p-4 bg-black/50 rounded border border-cyan-500/50 animate-pulse">
                <p class="text-sm text-gray-400 mb-2">New Token Generated (Copy it now!):</p>
                <code id="token-value" class="text-2xl font-mono text-cyan-300 select-all cursor-pointer"></code>
            </div>
        </div>

        <!-- Danger / Reset Section -->
        <div class="mb-12 p-4 bg-red-950/40 border border-red-700/50 rounded-lg">
            <h2 class="text-lg font-bold mb-2 text-red-300">Zone de maintenance</h2>
            <p class="text-sm text-gray-400 mb-4">Réinitialise la base : supprime snippets + tokens, crée une sauvegarde automatique et régénère un token admin.</p>
            <button id="btn-reset-db" class="bg-red-700 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-lg transition">🧹 Réinitialiser la base</button>
        </div>

        <hr class="border-gray-700 mb-8">

        <!-- List Section -->
        <div>
            <h2 class="text-xl font-bold mb-4 text-gray-300">Active Tokens</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700 text-gray-300 uppercase">
                        <tr>
                            <th class="p-3">Role</th>
                            <th class="p-3">Token (Partial)</th>
                            <th class="p-3">Created</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="token-list" class="divide-y divide-gray-700">
                        <!-- Tokens here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="./js/admin_panel.js"></script>
</body>

</html>
